name: Adaptive DCA CI

on:
  push:
    branches: [institutional-upgrade]
  pull_request:
    branches: [main]
    paths:
      - "core/adaptive_dca.py"
      - "core/dca_manager.py"
      - "tests/unit/test_adaptive_dca.py"
      - ".github/workflows/adaptive-dca-ci.yml"

permissions:
  contents: read

jobs:
  adaptive-dca:
    name: Adaptive DCA tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml

      - name: Compile adaptive DCA modules
        run: python -m py_compile core/adaptive_dca.py core/dca_manager.py

      - name: Run adaptive DCA unit tests
        run: pytest tests/unit/test_adaptive_dca.py -q
