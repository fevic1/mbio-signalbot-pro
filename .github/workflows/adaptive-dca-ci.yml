name: Adaptive DCA CI

on:
  push:
    branches: [institutional-upgrade, 'dca/**']
  pull_request:
    paths:
      - "core/adaptive_dca.py"
      - "core/dca_manager.py"
      - "core/dca_runtime.py"
      - "monitoring/adaptive_dca_supervisor.py"
      - "tests/unit/test_adaptive_dca.py"
      - "tests/unit/test_dca_runtime.py"
      - "tests/unit/test_adaptive_dca_wiring.py"
      - ".github/workflows/adaptive-dca-ci.yml"

permissions:
  contents: read

jobs:
  adaptive-dca:
    name: Adaptive DCA tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio pyyaml

      - name: Compile DCA modules
        run: |
          python -m py_compile \
            core/adaptive_dca.py \
            core/dca_manager.py \
            core/dca_runtime.py \
            monitoring/adaptive_dca_supervisor.py \
            main.py

      - name: Diff hygiene
        run: git diff --check

      - name: Run adaptive DCA unit tests
        run: |
          pytest \
            tests/unit/test_adaptive_dca.py \
            tests/unit/test_dca_runtime.py \
            tests/unit/test_adaptive_dca_wiring.py \
            -q
