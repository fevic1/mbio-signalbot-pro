version: AIOS-AGENT-REGISTRY-v1

agents:

  ArchitectureAgent:
    prompt: .aios/prompts/agents/ArchitectureAgent.md
    permission: Level 1
    role_title: Chief Architecture Agent
    memory:
      read:
        - .aios/memory/
      write:
        - .aios/decisions/

  SecurityAgent:
    prompt: .aios/prompts/agents/SecurityAgent.md
    permission: Level 0
    role_title: Security Red Team Agent
    memory:
      read:
        - .aios/memory/
      write:
        - .aios/audits/

  ExecutionAgent:
    prompt: .aios/prompts/agents/ExecutionAgent.md
    permission: Level 2
    role_title: Production Execution Agent
    memory:
      read:
        - .aios/memory/
      write:
        - .aios/decisions/

  VerifierAgent:
    prompt: .aios/prompts/agents/VerifierAgent.md
    permission: Level 0
    role_title: Verification Agent
    memory:
      read:
        - .aios/memory/
      write:
        - .aios/audits/
