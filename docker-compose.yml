services:
  frontend-builder:
    image: node:20-alpine
    container_name: mbio-frontend-builder
    volumes:
      - ./dashboard-v3:/app
      - frontend-dist:/app/dist
    working_dir: /app
    command: sh -c "npm install && npm run build"
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  mbio-bot:
    build: .
    container_name: mbio-signalbot
    ports:
      - "8001:8000"
    volumes:
      - ./config:/app/config:ro
      - ./core:/app/core:ro
      - ./execution:/app/execution:ro
      - ./routes:/app/routes:ro
      - ./monitoring:/app/monitoring:ro
      - ./data:/app/data
      - ./db:/app/db
      - ./templates:/app/templates:ro
      - ./aios-console:/app/aios-console:ro
    environment:
      HL_PRIVATE_KEY: ${HL_PRIVATE_KEY}
      HL_ACCOUNT_ADDRESS: ${HL_ACCOUNT_ADDRESS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      MBIO_SESSION_SECRET: ${MBIO_SESSION_SECRET}
      MBIO_ADMIN_PASSWORD: ${MBIO_ADMIN_PASSWORD}
      MBIO_ADMIN_EMAIL: ${MBIO_ADMIN_EMAIL}
      # Source inspection is read-only and capped at two concurrent pages.
      FIRECRAWL_MAX_CONCURRENCY: "2"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
    networks:
      - mbio-network
    command:
      - python
      - main.py


  kokoro-tts:
    build:
      context: ./services/kokoro_tts
    container_name: aios-kokoro-tts
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      KOKORO_MODEL_PATH: /models/kokoro-v1.0.int8.onnx
      KOKORO_VOICES_PATH: /models/voices-v1.0.bin
      KOKORO_VOICE: ${AIOS_TTS_VOICE:-af_sarah}
      KOKORO_MAX_CHARS: ${AIOS_TTS_MAX_CHARS:-900}
    mem_limit: 640m
    cpus: "0.75"
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 90s
    networks:
      - mbio-network
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: mbio-redis
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    networks:
      - mbio-network

  nginx:
    image: nginx:1.25-alpine
    container_name: mbio-nginx
    ports:
      - "8000:80"
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard-v3/dist:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      mbio-bot:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - mbio-network

networks:
  mbio-network:
    driver: bridge

volumes:
  frontend-dist:
